name: Sync official upstream

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hires-official-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: hires-dev

      - name: Merge official upstream locally
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch --no-tags upstream master
          git fetch --no-tags origin hires-stable

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Official upstream is already contained in hires-dev."
          else
            git merge --no-edit upstream/master
          fi

          if git merge-base --is-ancestor HEAD origin/hires-stable; then
            echo "needs_promotion=false" >> "$GITHUB_OUTPUT"
            echo "hires-dev is already contained in hires-stable."
          else
            echo "needs_promotion=true" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream_sha=$(git rev-parse upstream/master)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.merge.outputs.needs_promotion == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        if: steps.merge.outputs.needs_promotion == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run guarded tests
        if: steps.merge.outputs.needs_promotion == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_resolution_adapter.py' -v
          python -m unittest discover -s tests -p 'test_upstream_sync.py' -v
          python -m py_compile \
            deploy/upstream.py deploy/git.py deploy/config.py \
            module/device/resolution.py module/device/device.py \
            module/device/screenshot.py module/device/control.py \
            module/device/method/uiautomator_2.py module/device/method/droidcast.py

      - name: Push tested development branch
        if: steps.merge.outputs.needs_promotion == 'true'
        run: git push origin HEAD:hires-dev

      - name: Save rollback point and promote stable branch
        if: steps.merge.outputs.needs_promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          stable_sha="$(git rev-parse origin/hires-stable)"
          git push --force origin "$stable_sha:refs/heads/hires-stable-rollback"

          pr_url="$(gh pr list \
            --base hires-stable \
            --head hires-dev \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            body="Automatically merged the latest official master into hires-dev. "
            body+="The guarded resolution and updater tests passed; "
            body+="hires-stable-rollback points to the previous stable revision."
            pr_url="$(gh pr create \
              --base hires-stable \
              --head hires-dev \
              --title "chore: sync official upstream ${UPSTREAM_SHA:0:8}" \
              --body "$body")"
          fi
          gh pr merge "$pr_url" --merge --delete-branch=false

          git fetch --no-tags origin hires-stable
          git merge-base --is-ancestor HEAD origin/hires-stable
